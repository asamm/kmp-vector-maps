[versions]
# Project
version = "0.1.0"

# Android — aligned with locus-core
androidCompileSdk = "37"
androidMinSdk = "24"
androidGradlePlugin = "9.4.1"

# Kotlin — aligned with locus-core
# https://kotlinlang.org/docs/releases.html
kotlin = "2.4.20"

# https://github.com/Kotlin/kotlinx.coroutines/releases
kotlinxCoroutines = "1.11.0"

# Compose Multiplatform Desktop — used only by :viewer:desktop
# https://github.com/JetBrains/compose-multiplatform/releases
composeMultiplatform = "1.12.1"
composeMaterial3 = "1.9.0"

# https://github.com/openjdk/jmh/tags, https://github.com/melix/jmh-gradle-plugin/releases
jmh = "1.37"
jmhPlugin = "0.7.3"

# Vendored Mapsforge dependencies, versions as in Mapsforge 0.30.0
# https://bigbadaboom.github.io/androidsvg/
androidSvg = "1.4"
kxml2 = "2.3.0"
svgSalamander = "1.1.3"

# Unmodified upstream, only for the golden corpus (:formats:mapsforge:golden-upstream)
upstreamMapsforge = "0.30.0"

[libraries]
composeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
androidSvg = { module = "com.caverock:androidsvg", version.ref = "androidSvg" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }
svgSalamander = { module = "guru.nidi.com.kitfox:svgSalamander", version.ref = "svgSalamander" }
upstreamMapsforgeAwt = { module = "com.github.mapsforge.mapsforge:mapsforge-map-awt", version.ref = "upstreamMapsforge" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
androidLibrary = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
