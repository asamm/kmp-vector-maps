name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Android + JVM)
    # pinned: golden renders depend on the runner's fonts and JDK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Robolectric fetches its Android runtime (~190 MB) into ~/.m2, outside the Gradle cache
      - name: Cache Robolectric runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # includes the Mapsforge golden tests: upstream and vendored renders on the same runner
      - name: Gradle build + tests
        run: ./gradlew build

      # PNGs rendered from OSM data are ODbL Produced Works: © OpenStreetMap contributors
      - name: Upload golden renders
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-renders
          path: |
            formats/mapsforge/golden/build/golden/
            formats/mapsforge/golden-upstream/build/golden/expected/
            formats/mapsforge/golden-android/build/golden/
            formats/mapsforge/golden-android-upstream/build/golden/expected/
          if-no-files-found: ignore
