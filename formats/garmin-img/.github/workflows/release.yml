name: Release

on:
  push:
    tags:
      - "v[0-9]*"

# Prevent two concurrent release publishes from racing on the same tag. Not cancelled —
# let an in-progress publish finish before the next one starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release (Android + JVM + KMP metadata)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/publish-module
        with:
          is-release: 'true'
          publish-metadata: 'true'
          publish-jvm: 'true'
          publish-android: 'true'
          gpr-token: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
