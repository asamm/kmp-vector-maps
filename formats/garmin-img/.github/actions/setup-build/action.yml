name: Setup build environment
description: 'Sets up JDK 17 and Gradle for building and publishing the kmp-garmin-img module.'
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
