name: Publish
description: >
  Publishes selected kmp-garmin-img variants to GitHub Packages. Each flag is independent —
  callers pick the exact set of publications. Phase A targets are Android + JVM + KMP
  metadata; iOS / JS jobs are deliberately absent and will be added when those targets land.
  Requires actions/checkout + setup-build to have run.
inputs:
  publish-metadata:
    description: 'Publish Kotlin Multiplatform metadata (.module manifest + common sources).'
    required: false
    default: 'false'
  publish-jvm:
    description: 'Publish JVM Maven artifact.'
    required: false
    default: 'false'
  publish-android:
    description: 'Publish Android Maven artifact (AGP 9.x, single variant).'
    required: false
    default: 'false'
  is-release:
    description: 'Release (true) or snapshot with commit-short-SHA suffix (false).'
    required: false
    default: 'false'
  gpr-token:
    description: 'GitHub token with write:packages permission.'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        TASKS=""
        if [ "${{ inputs.publish-metadata }}" = "true" ]; then
          TASKS="$TASKS :lib:publishKotlinMultiplatformPublicationToGitHubPackagesRepository"
        fi
        if [ "${{ inputs.publish-jvm }}" = "true" ]; then
          TASKS="$TASKS :lib:publishJvmPublicationToGitHubPackagesRepository"
        fi
        if [ "${{ inputs.publish-android }}" = "true" ]; then
          TASKS="$TASKS :lib:publishAndroidPublicationToGitHubPackagesRepository"
        fi
        if [ -z "$TASKS" ]; then
          echo "::error::No publish flags set — nothing to do."
          exit 1
        fi
        GRADLE_ARGS=""
        if [ "${{ inputs.is-release }}" != "true" ]; then
          GRADLE_ARGS="-PisSnapshot -PsnapshotSuffix=$(git rev-parse --short HEAD)"
        fi
        echo "Running: ./gradlew $TASKS $GRADLE_ARGS"
        ./gradlew $TASKS $GRADLE_ARGS
      env:
        GPR_USERNAME: ${{ github.actor }}
        GPR_TOKEN: ${{ inputs.gpr-token }}
