[versions]
# Project
version = "0.1.0"

# Android — aligned with locus-core-2 / kmp-logger
androidCompileSdk = "36"
androidMinSdk = "24"
androidGradlePlugin = "9.1.1"

# Kotlin — aligned with locus-core-2 / kmp-logger
# https://kotlinlang.org/docs/releases.html
kotlin = "2.3.20"

# Multiplatform deps
# https://github.com/Kotlin/kotlinx.coroutines/releases
kotlinxCoroutines = "1.10.2"
# https://github.com/Kotlin/kotlinx-io/releases
kotlinxIo = "0.8.0"

# Asamm KMP libs
# https://github.com/asamm/kmp-logger
kmpLogger = "0.9.1"

# Compose Multiplatform Desktop — used only by :viewer (development tool).
# https://github.com/JetBrains/compose-multiplatform/releases
composeMultiplatform = "1.7.3"

[libraries]
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxIoCore = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kmpLogger = { module = "com.asamm.kmp:kmp-logger", version.ref = "kmpLogger" }

[plugins]
# AGP 9.x: use the KMP-library variant when combined with Kotlin Multiplatform.
# https://developer.android.com/kotlin/multiplatform/plugin
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

# Used only by :viewer:android — standalone Android app project, no KMP.
# AGP 9 has built-in Kotlin support so no separate kotlin-android plugin.
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }

# Used only by :viewer.
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose compiler plugin — mandatory since Kotlin 2.0.
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
